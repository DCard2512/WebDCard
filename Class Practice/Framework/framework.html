<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid Framework</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="grid">

        <!-- ROW 1: Single Column Row -->
            <div class="row">
                <div class="col-12">
                    <p>12 wide</p>
                </div>
            </div>

            <!-- ROW 2: TWO COLUMNS OF EQUAL SIZE -->
                <div class="row">
                    <div class="col-6">
                        <p>6 wide</p>
                    </div>
                    <div class="col-6">
                        <p>6 wide</p>
                    </div>
                </div>

                <!-- ROW 3: THREE COLUMNS OF EQUAL SIZE -->
                    <div class="row">
                        <div class="col-4">
                            <p>4 wide</p>
                        </div>
                        <div class="col-4">
                            <p>4 wide</p>
                        </div>
                        <div class="col-4">
                            <p>4 wide</p>
                        </div>
                    </div>

                    <!-- ROW 4: THREE COLUMNS. COLUMN 1 (1/4) COLUMN 2 (2/4) COLUMN 3 (1/4) -->
                        <div class="row">
                            <div class="col-3">
                                <p>3 wide</p>
                            </div>
                            <div class="col-6">
                                <p>6 wide</p>
                            </div>
                            <div class="col-3">
                                <p>3 wide</p>
                            </div>
                        </div>

                        <!-- ROW 5: TWO COLUMNS. COLUMN 1 (1/4) COLUMN 2 (3/4) -->
                            <div class="row">
                                <div class="col-3">
                                    <p>3 wide</p>
                                </div>
                                <div class="col-9">
                                    <p>9 wide</p>
                                </div>
                            </div>

    </div>
</body>

</html>
