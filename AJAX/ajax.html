<!DOCTYPE html>
<html>

<head>
  <title>Greeting by Name</title>
  <!-- CDNs include Mobile CSS and Core JavaScript files -->

  <script src="https://code.jquery.com/jquery-1.11.3.min.js"></script>

</head>

<body>

  <div data-role="page">
    <div data-role="header">
      <h1>Message with Name Input</h1>
    </div>

    <div data-role="content">
      <!--TEXTFIELD FOR NAME INPUT -->
      Enter your name: <input type="text" id="myname"><br>

      <!--GREET BUTTON -->

      <!-- DISPLAYS MESSAGE -->
      <div id="message"></div>
    </div>
  </div>

</body>
